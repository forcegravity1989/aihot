# config/reader.yaml —— 读者画像（可手工编辑，spec-v0.3 §4.2）。
#
# interests：显式兴趣乘数（>1 加权，<1 降权）。三类维度——
#   tags     主题标签 → 乘数（与 item.tags 精确匹配，小写）
#   sources  信源名子串 → 乘数（子串命中 item.source 即生效）
#   people   builder handle（去 @，小写）→ 乘数
# mute：命中即把 personal_score 归零（不改 hotness 本身）。
#
# 最终乘数 = 显式 interests × 从 history.jsonl/feedback.jsonl 派生的近期偏好。
interests:
  tags:
    claude-code: 1.6
    agent: 1.4
    models: 1.3
    research: 1.1
  sources: {}                # 例：{Anthropic: 1.3}
  people: {}                 # 例：{karpathy: 1.4}
mute:
  tags: []
  people: []
