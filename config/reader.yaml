# interests：兴趣乘数（>1 加权，<1 降权），最终再乘上从 history/feedback 派生的近期偏好
#   tags     与 item.tags 精确匹配（小写）
#   sources  子串命中 item.source 即生效
#   people   builder handle（去 @，小写）
# mute：命中即把 personal_score 归零（不改 hotness）
interests:
  tags:
    claude-code: 1.6
    agent: 1.4
    infra: 1.4
    serving: 1.3
    kernel: 1.3
    models: 1.3
    training: 1.2
    hardware: 1.2
    framework: 1.1
    release: 1.1
    research: 1.1
  sources: {}                # 例：{Anthropic: 1.3}
  people: {}                 # 例：{karpathy: 1.4}
mute:
  tags: []
  people: []
