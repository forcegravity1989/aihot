# match 块内字段之间是 AND；要 OR 用 any_of: [块, 块, ...]。可用字段：
#   tags_any / tags_all  item.tags 命中任一 / 全部（大小写不敏感）
#   sources_include      对 source_list 做大小写不敏感子串匹配
#   keywords_any         title + summary casefold 后子串匹配
#   aihot_category       extra.category 命中任一
#   categories           extra.category / extra.source_category 命中任一
#   formats              extra.format 命中任一（news/blog/video/talk/podcast/repo/paper/x）
#   platforms            extra.platform 命中任一
#   source_kinds         item.source_kind 命中任一
# name 同时是 channels/<name>.md 的文件名；一条 item 可进多个频道，频道内按 hotness 降序截断 limit

defaults:
  limit: 30
  # 同一信源在单个频道内最多占几席（频道级可覆盖，0 = 不限）；软上限，铺不满 limit 时按热度回填
  max_per_source: 3
  # 同一家的多个信源在 max_per_source 里算一个；匹配规则同 model-sources.yaml（子串、取最长 key）
  source_groups:
    anthropic:  ["anthropic", "claude blog", "claude code", "claude 官方"]
    openai:     ["openai"]
    google:     ["deepmind", "google"]
    arxiv:      ["arxiv"]
    github:     ["github trending"]
    huggingface: ["huggingface"]

channels:
  - name: headlines
    title: 头条
    limit: 20
    match:
      any_of:
        - tags_any: [official, models, claude-code]
        - formats: [news, blog, video, talk]
        - categories: [models, industry, claude-code]

  - name: models
    title: 模型发布
    limit: 30
    match:
      any_of:
        - tags_any: [models, model]
        - categories: [models]
        - aihot_category: [llm]
        - keywords_any:
            ["claude", "gpt-", "chatgpt", "gemini", "llama", "qwen", "deepseek",
             "mistral", "grok", "kimi", "glm", "大模型"]

  - name: claude-code
    title: Claude Code 动态
    limit: 30
    match:
      any_of:
        - tags_any: [claude-code, claude_code]
        - categories: [claude-code]
        - keywords_any: ["claude code", "claude-code", "claude cli", "cc plugin"]

  - name: practices
    title: 方法论
    limit: 30
    match:
      any_of:
        - tags_any: [practices]
        - categories: [practices]
        - keywords_any: [loop, sdlc, eval, harness, workflow, agent]

  - name: talks
    title: 演讲大会
    limit: 30
    match:
      formats: [video, talk]

  - name: podcasts
    title: 播客
    limit: 30
    match:
      formats: [podcast]

  - name: trending
    title: 趋势项目
    limit: 30
    match:
      formats: [repo]

  - name: change-intel
    title: 变更情报
    limit: 30
    match:
      any_of:
        - formats: [changelog]
        - tags_any: [changelog]

  - name: papers
    title: 论文
    limit: 30
    match:
      any_of:
        - formats: [paper]
        - categories: [papers]

  - name: model-dev
    title: 模型研发
    limit: 30
    match:
      any_of:
        - tags_any: [research, arxiv, paper, training, eval]
        - aihot_category: [research, dev]
        - keywords_any:
            ["pretrain", "post-train", "fine-tune", "finetune", "rlhf", "benchmark",
             "scaling law", "distill", "quantization", "推理优化", "强化学习"]

  - name: infra
    title: AI 基础设施
    limit: 30
    match:
      # 只用极具体的技术词：inference/gpu 这类宽泛词会让高权重的 changelog 源劫持整个频道
      any_of:
        - tags_any: [infra, hardware, framework, serving]
        - categories: [infra]
        - keywords_any:
            ["vllm", "sglang", "tensorrt", "trainium", "kv cache", "kv-cache",
             "cuda kernel", "推理引擎", "显存占用"]

  - name: plugins
    title: 插件生态
    limit: 30
    match:
      any_of:
        - tags_any: [plugins, insights, mcp, skills]
        - source_kinds: [insights]
        - keywords_any: ["plugin", "mcp server", "marketplace", "skill", "插件"]

  - name: builders-live
    title: 大牛动态
    limit: 40
    match:
      any_of:
        - source_kinds: [builders]
        - tags_any: [builders]

  - name: x-watch
    title: X 观察
    limit: 40
    match:
      any_of:
        - platforms: [x, twitter]
        - tags_any: [x, twitter]

  - name: releases
    title: 版本发布
    limit: 20
    match:
      tags_any: [release]

  - name: research
    title: 论文前沿
    limit: 20
    match:
      any_of:
        - tags_any: [arxiv, paper]
        - sources_include: [arxiv]

  - name: company-internal
    title: 公司内网
    limit: 30
    match:
      source_kinds: [company]
